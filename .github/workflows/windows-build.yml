name: Windows build (fork CI)

on:
  push:
    branches:
      - ci/windows-build

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Check out the fork CI branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Apply CI-only FFmpeg source-root workaround
        shell: pwsh
        run: |
          git -C daemon apply --ignore-whitespace (Join-Path $env:GITHUB_WORKSPACE '.github\ci\ffmpeg-source-root.patch')
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to apply the CI-only FFmpeg source-root workaround'
          }

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          arch: win64_msvc2022_64
          modules: 'qtwebengine qtmultimedia qtnetworkauth qtwebchannel qtwebsockets qtwebview qt5compat qtpositioning'
          cache: true

      - name: Install AMD AMF headers
        shell: pwsh
        run: |
          $amfRoot = Join-Path $env:RUNNER_TEMP 'amf-headers'
          git clone --depth 1 --filter=blob:none --sparse `
            https://github.com/GPUOpen-LibrariesAndSDKs/AMF.git $amfRoot
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to clone the AMD AMF headers repository'
          }
          git -C $amfRoot sparse-checkout set amf/public/include
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to select the AMD AMF public headers'
          }

          $amfInclude = Join-Path $amfRoot 'amf\public\include'
          $amfDestination = Join-Path $env:GITHUB_WORKSPACE 'daemon\contrib\msvc\include\AMF'
          if (-not (Test-Path (Join-Path $amfInclude 'core\Version.h'))) {
            throw "AMD AMF headers not found under $amfInclude"
          }
          New-Item -ItemType Directory -Force -Path $amfDestination | Out-Null
          Copy-Item -Path (Join-Path $amfInclude '*') `
            -Destination $amfDestination -Recurse -Force
          Write-Host "Installed AMD AMF headers into $amfDestination"

      - name: Install assembler tools
        shell: pwsh
        run: |
          $toolRoot = Join-Path $env:RUNNER_TEMP 'jami-assembler-tools'
          New-Item -ItemType Directory -Force -Path $toolRoot | Out-Null

          $visualTools = @(
            @{
              Name = 'VSNASM'
              Url = 'https://github.com/ShiftMediaProject/VSNASM/releases/download/0.8/VSNASM.zip'
            },
            @{
              Name = 'VSYASM'
              Url = 'https://github.com/ShiftMediaProject/VSYASM/releases/download/0.7/VSYASM.zip'
            }
          )

          foreach ($tool in $visualTools) {
            $zipPath = Join-Path $toolRoot ($tool.Name + '.zip')
            $extractPath = Join-Path $toolRoot ($tool.Name + '_UNZIP')
            Invoke-WebRequest -Uri $tool.Url -OutFile $zipPath
            Expand-Archive -LiteralPath $zipPath -DestinationPath $extractPath -Force

            $installScript = Join-Path $extractPath 'install_script.bat'
            $arguments = @('/c', "set ISINSTANCE=1 && call `"$installScript`"")
            $process = Start-Process -FilePath 'cmd.exe' -ArgumentList $arguments `
              -Wait -PassThru -NoNewWindow
            if ($process.ExitCode -ne 0) {
              throw "$($tool.Name) installation failed with exit code $($process.ExitCode)"
            }
          }

          $msysRoot = if (Test-Path 'C:\msys64') {
            'C:\msys64'
          } elseif (Test-Path 'C:\tools\msys64') {
            'C:\tools\msys64'
          } else {
            throw 'MSYS2 installation not found'
          }
          $msysBin = Join-Path $msysRoot 'usr\bin'
          $msysBash = Join-Path $msysBin 'bash.exe'
          if (-not (Test-Path $msysBin)) {
            throw "MSYS2 bin directory not found: $msysBin"
          }

          # build_ffmpeg.bat starts a login shell, so make the tool path
          # available both to this step and to subsequent workflow steps.
          $env:Path = "$msysBin;$env:Path"
          Add-Content -Path $env:GITHUB_PATH -Value $msysBin

          $yasmSource = Join-Path $toolRoot 'VSYASM_UNZIP\yasm\yasm-64.exe'
          if (-not (Test-Path $yasmSource)) {
            throw "Yasm executable not found in VSYASM archive: $yasmSource"
          }
          Copy-Item -Path $yasmSource -Destination (Join-Path $msysBin 'yasm.exe') -Force

          & (Join-Path $msysBin 'yasm.exe') --version
          if ($LASTEXITCODE -ne 0) {
            throw 'Yasm executable verification failed'
          }

          $nasmArchive = Join-Path $toolRoot 'nasm.zip'
          $nasmExtractPath = Join-Path $toolRoot 'NASM_UNZIP'
          Invoke-WebRequest `
            -Uri 'https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/win64/nasm-2.16.03-win64.zip' `
            -OutFile $nasmArchive
          Expand-Archive -LiteralPath $nasmArchive -DestinationPath $nasmExtractPath -Force
          $nasmSource = Get-ChildItem -LiteralPath $nasmExtractPath -Filter 'nasm.exe' -File -Recurse |
            Select-Object -First 1
          if (-not $nasmSource) {
            throw 'NASM executable not found in downloaded archive'
          }
          Copy-Item -Path $nasmSource.FullName `
            -Destination (Join-Path $msysBin 'nasm.exe') -Force

          & (Join-Path $msysBin 'nasm.exe') -v
          if ($LASTEXITCODE -ne 0) {
            throw 'Nasm executable verification failed'
          }

          $env:MSYS2_PATH_TYPE = 'inherit'
          & $msysBash --login -lc 'command -v nasm && nasm -v && command -v yasm && yasm --version'
          if ($LASTEXITCODE -ne 0) {
            throw 'MSYS2 login shell cannot find nasm/yasm'
          }

          $gasPreprocessorPath = Join-Path $toolRoot 'gas-preprocessor.pl'
          Invoke-WebRequest `
            -Uri 'https://raw.githubusercontent.com/FFmpeg/gas-preprocessor/master/gas-preprocessor.pl' `
            -OutFile $gasPreprocessorPath
          Move-Item -Path $gasPreprocessorPath `
            -Destination (Join-Path $msysBin 'gas-preprocessor.pl') -Force

      - name: Install pywinmake
        id: pywinmake
        shell: pwsh
        run: |
          $pywinmakeDir = Join-Path $env:RUNNER_TEMP 'pywinmake'
          git clone --depth 1 https://review.jami.net/pywinmake $pywinmakeDir
          git -C $pywinmakeDir apply (Join-Path $env:GITHUB_WORKSPACE '.github\ci\pywinmake-fetcher-rootdir.patch')
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to apply the pywinmake archive-root patch'
          }
          python -m pip install --force-reinstall --no-deps $pywinmakeDir
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to install the patched pywinmake package'
          }

          $fetcherPath = python -c "import pywinmake.package.fetcher as f; print(f.__file__)"
          if ($LASTEXITCODE -ne 0 -or -not $fetcherPath) {
            throw 'Could not locate the imported pywinmake fetcher'
          }
          Write-Host "Using pywinmake fetcher: $fetcherPath"
          $fetcherSource = Get-Content -LiteralPath $fetcherPath -Raw
          if ($fetcherSource -notmatch 'os\.path\.abspath\(self\.buildsrc_dir\)' -or
              $fetcherSource -notmatch 'dst_dir\.mkdir\(parents=True, exist_ok=True\)') {
            throw "The imported pywinmake fetcher is not patched: $fetcherPath"
          }

          $commit = git -C $pywinmakeDir rev-parse HEAD
          "commit=$commit" >> $env:GITHUB_OUTPUT

      - name: Cache daemon source archives
        uses: actions/cache@v4
        with:
          path: daemon/contrib/tarballs
          key: windows-2022-x64-daemon-tarballs-${{ hashFiles('daemon/contrib/src/**', 'daemon/contrib/*.mak') }}

      - name: Cache daemon compiled dependencies
        id: daemon-build-cache
        uses: actions/cache/restore@v4
        with:
          path: daemon/contrib/build
          key: windows-2022-x64-daemon-build-v3-${{ steps.pywinmake.outputs.commit }}-${{ hashFiles('daemon/contrib/src/**', 'daemon/contrib/*.mak', 'daemon/extras/scripts/winmake.py', '.github/ci/**') }}

      - name: Prepare Windows Jami build
        shell: pwsh
        run: |
          $ffmpegBuildDir = Join-Path $env:GITHUB_WORKSPACE 'daemon\contrib\build\ffmpeg'
          if (Test-Path $ffmpegBuildDir) {
            Write-Host "Removing cached FFmpeg build directory: $ffmpegBuildDir"
            Remove-Item -LiteralPath $ffmpegBuildDir -Recurse -Force
          }
          $ffmpegStateFile = Join-Path $env:GITHUB_WORKSPACE 'daemon\contrib\build\state\ffmpeg.json'
          if (Test-Path $ffmpegStateFile) {
            Write-Host "Removing cached FFmpeg state file: $ffmpegStateFile"
            Remove-Item -LiteralPath $ffmpegStateFile -Force
          }

          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Lib'
          $sdk = Get-ChildItem -LiteralPath $sdkRoot -Directory |
            Sort-Object -Property Name -Descending |
            Select-Object -First 1 -ExpandProperty Name
          if (-not $sdk) {
            throw "Windows SDK not found under $sdkRoot"
          }
          "JAMI_WINDOWS_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $daemonEnvPatch = Join-Path $env:GITHUB_WORKSPACE '.github\ci\daemon-msvc-env-parser.patch'
          git -C (Join-Path $env:GITHUB_WORKSPACE 'daemon') apply --check $daemonEnvPatch
          git -C (Join-Path $env:GITHUB_WORKSPACE 'daemon') apply $daemonEnvPatch
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to apply the daemon Visual Studio environment parser patch'
          }

      - name: Build Y-CRDT FFI dependency
        shell: pwsh
        run: |
          if (-not $env:JAMI_WINDOWS_SDK) {
            throw 'Windows SDK version was not exported by the preparation step'
          }

          Push-Location (Join-Path $env:GITHUB_WORKSPACE 'daemon\compat\msvc')
          cargo --version
          python winmake.py -iv -s $env:JAMI_WINDOWS_SDK -b yffi
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          Pop-Location

          $yrsLib = Join-Path $env:GITHUB_WORKSPACE 'daemon\contrib\build\yffi\target\release\yrs.lib'
          $yrsHeader = Join-Path $env:GITHUB_WORKSPACE 'daemon\contrib\build\yffi\tests-ffi\include\libyrs.h'
          if (-not (Test-Path $yrsLib)) {
            throw "Y-CRDT library was not produced: $yrsLib"
          }
          if (-not (Test-Path $yrsHeader)) {
            throw "Y-CRDT header was not produced: $yrsHeader"
          }

      - name: Initialize Jami client project
        shell: pwsh
        run: |
          python extras/scripts/build-windows.py --init --qt "$env:QT_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $clientEnvPatch = Join-Path $env:GITHUB_WORKSPACE '.github\ci\client-msvc-env-parser.patch'
          git apply --check $clientEnvPatch
          git apply $clientEnvPatch
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to apply the client Visual Studio environment parser patch'
          }

      - name: Build Jami daemon
        shell: pwsh
        run: |
          if (-not $env:JAMI_WINDOWS_SDK) {
            throw 'Windows SDK version was not exported by the preparation step'
          }

          Push-Location (Join-Path $env:GITHUB_WORKSPACE 'daemon\compat\msvc')
          python winmake.py -iv -s $env:JAMI_WINDOWS_SDK -b daemon
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          Pop-Location

      - name: Build Jami Qt client
        shell: pwsh
        run: |
          python extras/scripts/build-windows.py --qt "$env:QT_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Create portable archive
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE 'x64\Release'
          if (-not (Test-Path $releaseDir)) {
            throw "Build output not found: $releaseDir"
          }
          Compress-Archive -Path (Join-Path $releaseDir '*') `
            -DestinationPath (Join-Path $env:RUNNER_TEMP 'jami-windows-x64.zip')

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: jami-windows-x64
          path: ${{ runner.temp }}/jami-windows-x64.zip
          if-no-files-found: error

      - name: Save daemon compiled dependencies
        if: success()
        uses: actions/cache/save@v4
        with:
          path: daemon/contrib/build
          key: windows-2022-x64-daemon-build-v3-${{ steps.pywinmake.outputs.commit }}-${{ hashFiles('daemon/contrib/src/**', 'daemon/contrib/*.mak', 'daemon/extras/scripts/winmake.py', '.github/ci/**') }}
